# Local development override: run the stack without Traefik.
#
# Usage:
#   export COMPOSE_FILE=compose.yml:compose.local.yml
#   docker compose up -d
#
# This file:
# - exposes varnish on http://localhost:8081
# - sets MW_SITE_SERVER to http://localhost:8081 unless .env sets it
# - sets a default admin password for fresh installs unless .env sets it
# - removes the traefik-public network from the stack
#
# Requires Docker Compose 2.24 or newer for `!reset`.

services:
    web:
        environment:
            - MW_SITE_SERVER=${MW_SITE_SERVER:-http://localhost:8081}
            - MW_ADMIN_PASS=${MW_ADMIN_PASS:-anyotherpassword}

    varnish:
        ports:
            - "127.0.0.1:8081:80"
        networks: !reset []

    matomo:
        networks: !reset []

networks: !reset []
